name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Compile, test, package, and enforce coverage
        run: ./mvnw --batch-mode clean verify

      - name: Validate deployment image
        run: docker build --tag "fulfilment-service:${{ github.sha }}" .

      - name: Add test and coverage results to job summary
        if: ${{ always() && hashFiles('target/surefire-reports/TEST-*.xml') != '' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv
          import glob
          import xml.etree.ElementTree as ET

          test_suites = [
              ET.parse(path).getroot()
              for path in glob.glob("target/surefire-reports/TEST-*.xml")
          ]
          tests = sum(int(suite.attrib.get("tests", 0)) for suite in test_suites)
          failures = sum(int(suite.attrib.get("failures", 0)) for suite in test_suites)
          errors = sum(int(suite.attrib.get("errors", 0)) for suite in test_suites)
          skipped = sum(int(suite.attrib.get("skipped", 0)) for suite in test_suites)

          print("## Test results")
          print()
          print("| Tests | Passed | Failures | Errors | Skipped |")
          print("| ---: | ---: | ---: | ---: | ---: |")
          print(
              f"| {tests} | {tests - failures - errors - skipped} | "
              f"{failures} | {errors} | {skipped} |"
          )

          coverage_path = "target/jacoco-report/jacoco.csv"
          try:
              with open(coverage_path, newline="") as report:
                  rows = list(csv.DictReader(report))
          except FileNotFoundError:
              print()
              print("JaCoCo report was not generated.")
          else:
              print()
              print("## JaCoCo coverage")
              print()
              print("| Metric | Covered | Total | Ratio |")
              print("| --- | ---: | ---: | ---: |")
              for metric in ("INSTRUCTION", "BRANCH", "LINE", "METHOD"):
                  covered = sum(int(row[f"{metric}_COVERED"]) for row in rows)
                  missed = sum(int(row[f"{metric}_MISSED"]) for row in rows)
                  total = covered + missed
                  print(
                      f"| {metric.title()} | {covered} | {total} | "
                      f"{covered / total:.2%} |"
                  )
          PY

      - name: Upload test reports
        if: ${{ always() && hashFiles('target/surefire-reports/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports
          if-no-files-found: error
          retention-days: 30

      - name: Upload coverage report
        if: ${{ always() && hashFiles('target/jacoco-report/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/jacoco-report
          if-no-files-found: error
          retention-days: 30

      - name: Upload packaged application
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: quarkus-application
          path: target/quarkus-app
          if-no-files-found: error
          retention-days: 30
