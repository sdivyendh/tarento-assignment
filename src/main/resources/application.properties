quarkus.http.port=${PORT:8080}
%prod.quarkus.http.host=0.0.0.0

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=${DB_USERNAME:quarkus_test}
%prod.quarkus.datasource.password=${DB_PASSWORD:quarkus_test}
%prod.quarkus.datasource.jdbc.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:15432/quarkus_test}
%prod.quarkus.datasource.jdbc.max-size=8
%prod.quarkus.datasource.jdbc.min-size=2

# Tests use an in-memory database so the suite remains runnable without Docker.
# PostgreSQL stays the production database and is still exercised by the same ORM mappings.
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:fulfilment;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.devservices.enabled=false
%test.quarkus.flyway.migrate-at-start=true

%dev.quarkus.hibernate-orm.log.sql=true
%test.quarkus.hibernate-orm.log.sql=false

# Development and tests start from deterministic demo data. Production must never drop or reseed
# operational data; schema changes should be applied through a migration process.
%dev.quarkus.hibernate-orm.database.generation=drop-and-create
%dev.quarkus.hibernate-orm.sql-load-script=import.sql
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.sql-load-script=import.sql
%prod.quarkus.hibernate-orm.database.generation=validate
%prod.quarkus.hibernate-orm.sql-load-script=no-file
%prod.quarkus.flyway.migrate-at-start=true

quarkus.openapi.generator.spec=warehouse-openapi.yaml
quarkus.openapi.generator.base-package=com.warehouse.api
